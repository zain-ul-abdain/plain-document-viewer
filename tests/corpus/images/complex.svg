<?xml version="1.0" encoding="UTF-8"?>
<!-- Gradients, a clip path, a transform, and right-to-left and CJK text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3c72"/><stop offset="1" stop-color="#2a5298"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#f57f17"/></radialGradient>
    <clipPath id="frame"><rect x="20" y="20" width="760" height="460" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="800" height="500" fill="url(#sky)"/>
    <circle cx="640" cy="130" r="70" fill="url(#sun)"/>
    <path d="M0 420 Q200 300 400 400 T800 380 V500 H0 Z" fill="#2e7d32"/>
    <g transform="rotate(-8 200 150)"><rect x="80" y="100" width="240" height="90" rx="12" fill="#ffffff" opacity="0.85"/></g>
  </g>
  <text x="400" y="250" font-family="Segoe UI, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle">Hello picture</text>
  <text x="400" y="300" font-family="Segoe UI, Tahoma, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" direction="rtl">اردو: یہ ایک تصویر ہے · سنڌي · العربية</text>
  <text x="400" y="345" font-family="Microsoft YaHei, Yu Gothic, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">中文 · 日本語 · 한국어</text>
</svg>
